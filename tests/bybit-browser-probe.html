<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Bybit CORS smoke probe</title></head>
<body>
<pre id="result">PROBE_PENDING</pre>
<script>
(async function () {
  const output = document.getElementById('result');
  const url = 'https://api.bybit.com/v5/market/tickers?category=linear&symbol=BTCUSDT';
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 10000);
  try {
    const response = await fetch(url, {mode:'cors',credentials:'omit',cache:'no-store',signal:controller.signal});
    if (!response.ok) throw new Error('HTTP ' + response.status);
    const body = await response.json();
    if (body.retCode !== 0 || !body.result || !Array.isArray(body.result.list) ||
        !body.result.list.some(row => row.symbol === 'BTCUSDT')) throw new Error('Unexpected Bybit response');
    output.textContent = 'PROBE_OK | Bybit BTCUSDT public endpoint reachable from test browser origin';
  } catch (error) {
    output.textContent = 'PROBE_FAIL | ' + (error && error.name || 'Error') + ' | ' + (error && error.message || 'unknown');
  } finally {
    clearTimeout(timeout);
  }
})();
</script>
</body>
</html>
