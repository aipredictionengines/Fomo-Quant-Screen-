name: Bybit Browser CORS Probe
on:
  pull_request:
  workflow_dispatch:
jobs:
  browser-cors:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Headless browser read-only public endpoint probe
        shell: bash
        run: |
          set -euo pipefail
          if command -v google-chrome >/dev/null 2>&1; then
            browser=google-chrome
          elif command -v chromium >/dev/null 2>&1; then
            browser=chromium
          else
            echo "::error::No Chrome/Chromium installed on GitHub runner"
            exit 1
          fi
          python3 -m http.server 8123 --bind 127.0.0.1 > /tmp/fomo-cors-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 2
          timeout 35s "$browser" --headless --no-sandbox --disable-gpu \
            --disable-dev-shm-usage --virtual-time-budget=16000 \
            --dump-dom 'http://127.0.0.1:8123/tests/bybit-browser-probe.html' \
            > /tmp/fomo-cors-result.html 2> /tmp/fomo-cors-stderr.txt || true
          # Read rendered DOM only. Searching the full HTML would falsely match JS source text.
          rendered=$(sed -n 's/.*<pre id="result">\([^<]*\)<\/pre>.*/\1/p' /tmp/fomo-cors-result.html | head -n 1)
          echo "Rendered probe result: ${rendered:-NO_RESULT}"
          if [[ "$rendered" == "PROBE_OK | Bybit"* ]]; then
            echo "Public Bybit browser CORS request PASS from GitHub runner localhost origin"
          else
            echo "::error::Bybit browser request failed/blocked. See probe output. This cannot establish user-region or GitHub Pages origin availability."
            exit 1
          fi
